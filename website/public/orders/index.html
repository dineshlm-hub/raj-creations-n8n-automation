<style>
:root { --bg: #faf6f1; --surface: #fff; --ink: #241c22; --muted: #6e6168; --line: #e9e0d8; --accent: #9c3d5a; --accent-dark: #7f2f48; --accent-soft: #f6e7ec; --ok: #2f7d5b; --ok-soft: #e4f2ea; --warn: #9a5a00; --warn-soft: #fbf0dc; --bad: #b42318; --bad-soft: #fdecea; --radius: 14px; --shadow: 0 1px 2px rgba(36,28,34,.06), 0 8px 24px rgba(36,28,34,.06); }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding-bottom: 96px; }
a { color: var(--accent); }
h1, h2, h3 { font-family: Georgia, "Playfair Display", serif; margin: 0 0 .4em; line-height: 1.2; }
h1 { font-size: 1.35rem; }
h2 { font-size: 1.15rem; }
button, input, textarea, select { font: inherit; color: inherit; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: rgba(250,246,241,.96); border-bottom: 1px solid var(--line); backdrop-filter: blur(6px); }
.top img { width: 30px; height: 30px; border-radius: 50%; }
.top .title { font-family: Georgia, serif; font-weight: 700; font-size: 1.05rem; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.wrap { max-width: 760px; margin: 0 auto; padding: 16px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-bottom: 14px; }
.muted { color: var(--muted); }
.small { font-size: .86rem; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 10px 16px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-weight: 600; text-decoration: none; color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-dark); }
.btn.wa { background: #1f8f4e; border-color: #1f8f4e; color: #fff; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .5; cursor: default; }
.btn.small { min-height: 34px; padding: 5px 10px; font-size: .85rem; border-radius: 10px; }
.link { background: none; border: 0; padding: 6px 4px; color: var(--accent); font-weight: 600; cursor: pointer; text-decoration: underline; }
label.field { display: block; margin: 12px 0; }
label.field span { display: block; font-weight: 600; margin-bottom: 4px; }
input[type=text], input[type=search], input[type=number], input[inputmode], textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; min-height: 44px; }
textarea { min-height: 70px; resize: vertical; }
.code-input { font-size: 1.6rem; letter-spacing: .4em; text-align: center; }
.msg { border-radius: 10px; padding: 10px 12px; margin: 10px 0; font-size: .95rem; }
.msg.err { background: var(--bad-soft); color: var(--bad); }
.msg.ok { background: var(--ok-soft); color: var(--ok); }
.msg.warn { background: var(--warn-soft); color: var(--warn); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 12px; }
.chip { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 12px; cursor: pointer; font-size: .9rem; }
.chip[aria-pressed=true] { background: var(--ink); color: #fff; border-color: var(--ink); }
.order { display: block; width: 100%; text-align: left; cursor: pointer; }
.order .row1 { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.order .id { font-weight: 700; }
.badge { display: inline-block; border-radius: 999px; padding: 2px 9px; font-size: .78rem; font-weight: 700; white-space: nowrap; }
.badge.new { background: var(--accent-soft); color: var(--accent-dark); }
.badge.updated { background: var(--warn-soft); color: var(--warn); }
.badge.confirmed { background: var(--ok-soft); color: var(--ok); }
.badge.cancelled { background: #eee; color: #555; }
.line { display: grid; grid-template-columns: 52px 1fr; gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); }
.line:first-of-type { border-top: 0; }
.thumb { width: 52px; height: 52px; border-radius: 10px; object-fit: cover; background: var(--accent-soft); }
.line .head { display: flex; justify-content: space-between; gap: 8px; }
.line .code { font-weight: 700; }
.line .amt { font-weight: 700; white-space: nowrap; }
.line.off .code, .line.off .amt, .line.off .sub { text-decoration: line-through; color: var(--muted); }
.tag { display: inline-block; font-size: .78rem; font-weight: 700; border-radius: 6px; padding: 1px 6px; margin: 4px 4px 0 0; }
.tag.oos { background: var(--bad-soft); color: var(--bad); }
.tag.lim { background: var(--warn-soft); color: var(--warn); }
.tag.new { background: var(--ok-soft); color: var(--ok); }
.tag.chg { background: #eef1f8; color: #34446b; }
.qty { display: flex; align-items: center; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.qty input { width: 76px; text-align: center; min-height: 38px; padding: 6px; }
.qty .step { width: 38px; min-height: 38px; padding: 0; }
.acts { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.totals .r { display: flex; justify-content: space-between; padding: 3px 0; }
.totals .grand { font-weight: 800; font-size: 1.1rem; border-top: 1px solid var(--line); margin-top: 6px; padding-top: 8px; }
.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: rgba(255,255,255,.97); border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); }
.bar .in { max-width: 760px; margin: 0 auto; display: flex; gap: 8px; }
.bar .in .btn { flex: 1; }
.sheet { position: fixed; inset: 0; z-index: 50; background: rgba(36,28,34,.45); display: flex; align-items: flex-end; justify-content: center; }
.sheet .panel { background: var(--bg); width: 100%; max-width: 760px; max-height: 92vh; overflow: auto; border-radius: 18px 18px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); }
.sheet .panel .close { float: right; }
.pick { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center; width: 100%; text-align: left; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 8px; margin-bottom: 8px; cursor: pointer; }
.pick img { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; background: var(--accent-soft); }
.preview { white-space: pre-wrap; background: #e7f6dc; border-radius: 12px; padding: 12px; font-size: .95rem; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: .92rem; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; }
.check { display: flex; gap: 10px; align-items: flex-start; margin: 10px 0; }
.check input { width: 22px; height: 22px; margin-top: 1px; flex: none; }
.spin { display: inline-block; width: 16px; height: 16px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: s .8s linear infinite; vertical-align: -3px; }
@keyframes s { to { transform: rotate(360deg); } }
</style>
